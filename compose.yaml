name: stead

x-stead: &stead
  build:
    context: .
  image: "${STEAD_IMAGE:-stead-local:latest}"
  environment: &ledger
    STEAD_MYSQL_DSN: "${STEAD_MYSQL_USER:-stead}:${STEAD_MYSQL_PASSWORD:?Set STEAD_MYSQL_PASSWORD}@tcp(mysql:3306)/${STEAD_MYSQL_DATABASE:-stead}"

services:
  mysql:
    image: mysql:8.0.40
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${STEAD_MYSQL_DATABASE:-stead}"
      MYSQL_USER: "${STEAD_MYSQL_USER:-stead}"
      MYSQL_PASSWORD: "${STEAD_MYSQL_PASSWORD:?Set STEAD_MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${STEAD_MYSQL_ROOT_PASSWORD:?Set STEAD_MYSQL_ROOT_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --password=\"$${MYSQL_PASSWORD}\" \"$${MYSQL_DATABASE}\" --execute='SELECT 1'"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 20

  migrate:
    <<: *stead
    command: ["migrate"]
    depends_on:
      mysql:
        condition: service_healthy

  api:
    <<: *stead
    command: ["serve", "-listen", ":8080"]
    restart: unless-stopped
    environment:
      <<: *ledger
      STEAD_API_TOKENS: "${STEAD_API_TOKENS:?Set STEAD_API_TOKENS}"
      STEAD_MODEL_ENDPOINT: "${STEAD_MODEL_ENDPOINT:-}"
      STEAD_MODEL: "${STEAD_MODEL:-}"
      STEAD_MODEL_API_KEY: "${STEAD_MODEL_API_KEY:-}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
    ports:
      - "${STEAD_BIND_ADDRESS:-127.0.0.1}:${STEAD_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 10

  worker:
    <<: *stead
    command: ["worker", "-deliveries", "/var/lib/stead/deliveries"]
    restart: unless-stopped
    environment:
      <<: *ledger
      STEAD_FEISHU_APP_ID: "${STEAD_FEISHU_APP_ID:-}"
      STEAD_FEISHU_APP_SECRET: "${STEAD_FEISHU_APP_SECRET:-}"
      STEAD_FEISHU_CHATS: "${STEAD_FEISHU_CHATS:-}"
    volumes:
      - deliveries:/var/lib/stead/deliveries
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  mysql-data:
  deliveries:
